<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hero Siege - Replay</title>
    <style>
      body { margin: 0; background: #0d0a14; color: #e8d8b0; font-family: monospace; }
      #hud { padding: 8px 12px; font-size: 14px; }
      canvas { display: block; margin: 0 auto; background: #161020; image-rendering: pixelated; }
      #bar { text-align: center; padding: 6px; }
      input[type="range"] { width: 60%; }
    </style>
  </head>
  <body>
    <div id="hud">Hero Siege - loading replay...</div>
    <canvas id="view" width="720" height="720"></canvas>
    <div id="bar"><button id="play">Pause</button> <input id="scrub" type="range" min="0" max="0" value="0" /></div>
    <script>
      const SPRITES = {
        hero: "hero_knight.png",
        skeleton: "monster_skeleton.png",
        demon: "monster_demon.png",
        sanctum: "sanctum.png",
        portal: "demon_portal.png",
        arcane_forge: "gold_shrine.png",
        healing_spring: "gold_shrine.png",
        gold_shrine: "gold_shrine.png",
      };
      const COLORS = {
        wall: "#2a2238", floor: "#161020", sanctum: "#f5c542", portal: "#a23bd6",
        arcane_forge: "#4aa3ff", healing_spring: "#3be08a", gold_shrine: "#f5c542",
        hero: "#e8e0c0", skeleton: "#cfd3d6", imp: "#ff7a4a", hellhound: "#b0581f", demon: "#d6334d",
      };
      const IMAGES = {};
      for (const [key, file] of Object.entries(SPRITES)) {
        const img = new Image();
        img.src = `/art/${file}`;
        IMAGES[key] = img;
      }
      const canvas = document.getElementById("view");
      const ctx = canvas.getContext("2d");
      const hud = document.getElementById("hud");
      const scrub = document.getElementById("scrub");
      const playBtn = document.getElementById("play");
      function cellAt(o, cell, key, color) {
        const img = IMAGES[key];
        if (img && img.complete && img.naturalWidth > 0) {
          ctx.drawImage(img, o.x * cell, o.y * cell, cell, cell);
        } else {
          ctx.fillStyle = color || "#fff";
          ctx.fillRect(o.x * cell, o.y * cell, cell, cell);
        }
      }
      function draw(s) {
        const cell = Math.floor(Math.min(canvas.width / s.width, canvas.height / s.height));
        ctx.fillStyle = COLORS.floor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = COLORS.wall;
        for (let x = 0; x < s.width; x++) { ctx.fillRect(x * cell, 0, cell, cell); ctx.fillRect(x * cell, (s.height - 1) * cell, cell, cell); }
        for (let y = 0; y < s.height; y++) { ctx.fillRect(0, y * cell, cell, cell); ctx.fillRect((s.width - 1) * cell, y * cell, cell, cell); }
        for (const p of s.portals) cellAt(p, cell, "portal", COLORS.portal);
        for (const sh of s.shrines) cellAt(sh, cell, sh.kind, COLORS[sh.kind]);
        cellAt(s.sanctum, cell, "sanctum", COLORS.sanctum);
        for (const m of s.monsters) cellAt(m, cell, m.kind, COLORS[m.kind]);
        for (const h of s.heroes) if (h.alive) cellAt(h, cell, "hero", COLORS.hero);
        hud.textContent = `Replay - Wave ${s.wave}/${s.num_waves} - Sanctum ${s.sanctum.hp}/${s.sanctum.max_hp} - Slain ${s.monsters_slain} - ${s.outcome || "in progress"}`;
      }
      let frames = [];
      let idx = 0;
      let playing = true;
      function show(i) { if (frames.length) { idx = Math.max(0, Math.min(i, frames.length - 1)); scrub.value = idx; draw(frames[idx]); } }
      playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? "Pause" : "Play"; };
      scrub.oninput = () => { playing = false; playBtn.textContent = "Play"; show(parseInt(scrub.value, 10)); };
      setInterval(() => { if (playing && frames.length) { show(idx + 1 >= frames.length ? 0 : idx + 1); } }, 100);
      const proto = location.protocol === "https:" ? "wss" : "ws";
      const ws = new WebSocket(`${proto}://${location.host}/replay`);
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === "replay") {
          frames = msg.frames || [];
          scrub.max = Math.max(0, frames.length - 1);
          show(0);
        }
      };
    </script>
  </body>
</html>
